{% extends "base.html" %}

{% block title %}Delete | IT Task Manager{% endblock %}

{% block content %}
  <h1 class="h3 fw-semibold mb-3">Delete</h1>
  <div class="row">
    <div class="col-lg-6">
      <div class="card shadow-sm border-danger">
        <div class="card-body p-4">
          <p>Are you sure you want to delete "{{ object }}"?</p>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{{ view.success_url }}" class="btn btn-outline-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
