{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{% if object %}Edit{% else %}New{% endif %} {{ entity }}{% endblock %}

{% block content %}
  <h1 class="h3 mb-4">{% if object %}Edit{% else %}New{% endif %} {{ entity }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ view.success_url }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
