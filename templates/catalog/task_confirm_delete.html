{% extends "base.html" %}

{% block title %}Delete task | IT Task Manager{% endblock %}

{% block content %}
  <h1 class="h3 mb-4">Delete task</h1>
  <p>Are you sure you want to delete "{{ task.name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'catalog:task-detail' task.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
